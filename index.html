<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unidad II · Formularios avanzados</title>
    <!-- Font Awesome 6 (gratuito) para iconos -->
    <link
rel="stylesheet"  
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    
    <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
    <form id="loginform" novalidate>
        <h1>Iniciar Sesion</h1>

        <div class="form-group">
            <label for="loginEmail">Correo electronico</label>
            <input 
            type="email"
            id="loginEmail"
            name="email"
            required
            placeholder="correo@unicaribe.edu.co"/>
            <span class="error-messag" id="emailError"></span>
            
        </div>
        <div class="form-group">
            <label for="loginPass">Contraseña</label>
            <input 
            type="password"
            id="loginPass"
            name="password"
            required
            minlength="6"
            placeholder="********"/>
            <span class="error-message" id="passError"></span>

        </div>

        <button type="submit" class="btn-primary">Iniciar sesion</button>
    
    </form>
    <div id="loginwelcome" class="welcome-card" style="display: none;">
        <h2>Bienvenido</h2>
        <p>Has iniciado sesion correctamente</p>
        <p>Correo: <span id="userEmailDisplay"></span></p>

    </div>

    
    

</body>

<script src="/js/login.js"></script>

</html>
